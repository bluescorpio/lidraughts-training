<!DOCTYPE html>
<html lang="zh-CN">

    <meta name="theme-color" content="#e8f0ea" />
    <title>王植训练站</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>

      <nav class="app-nav" id="main-nav" aria-label="主导航"></nav>

      <main id="page" class="page"></main>
